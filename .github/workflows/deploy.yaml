name: CD Pipeline

on:
  repository_dispatch:
    types: [deploy]
  push:
    branches: [main]

env:
  ARTIFACTS_BUCKET: fraud-detection-artifacts-charan
  REGION: ap-southeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
        API_KEY: ${{ secrets.API_KEY }}
        MODEL_SECRET: ${{ secrets.MODEL_SECRET }}
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Download latest model artifacts
        run: |
          set -euo pipefail
          mkdir -p container/model
          aws s3 sync "s3://${{ env.ARTIFACTS_BUCKET }}/models/" container/model/ \
            --region "${{ env.REGION }}"
          aws s3 cp "s3://${{ env.ARTIFACTS_BUCKET }}/reference.parquet" container/reference.parquet \
            --region "${{ env.REGION }}"

          for artifact in \
            meta_model.joblib \
            xgboost_model.joblib \
            random_forest_model.joblib \
            logistic_reg_model.joblib \
            imputer.joblib \
            scaler.joblib; do
            test -s "container/model/$artifact"
          done
          test -s container/reference.parquet

      - name: Validate deployment secrets
        run: |
          set -euo pipefail

          test -n "$API_KEY" || { echo "::error::API_KEY is missing"; exit 1; }
          test -n "$MODEL_SECRET" || { echo "::error::MODEL_SECRET is missing"; exit 1; }
          test -n "$UPSTASH_REDIS_REST_URL" || { echo "::error::Upstash URL is missing"; exit 1; }
          test -n "$UPSTASH_REDIS_REST_TOKEN" || { echo "::error::Upstash token is missing"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::GH_TOKEN is missing"; exit 1; }

      - run: npx sst deploy --stage production
