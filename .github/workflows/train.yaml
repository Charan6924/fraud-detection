name: Train Pipeline

on:
  repository_dispatch:
    types: [retrain]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/**"

env:
  ARTIFACTS_BUCKET: fraud-detection-artifacts-charan
  REGION: ap-southeast-2
  ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
  ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Build & push training image
        run: |
          set -euo pipefail
          REPO_URI=$(aws ecr describe-repositories \
            --repository-names fraud-detection-training \
            --query 'repositories[0].repositoryUri' --output text 2>/dev/null \
            || aws ecr create-repository \
            --repository-name fraud-detection-training \
            --query 'repository.repositoryUri' --output text)
          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "$REPO_URI"
          docker build -f ml/Dockerfile.train -t fraud-detection-training .
          docker tag fraud-detection-training:latest "$REPO_URI:latest"
          docker push "$REPO_URI:latest"

          test -n "$ECS_EXECUTION_ROLE_ARN"
          test -n "$ECS_TASK_ROLE_ARN"

          CLUSTER=$(aws ecs list-clusters \
            --query 'clusterArns[?contains(@,`ModelCluster`)] | [0]' --output text)
          test -n "$CLUSTER" && test "$CLUSTER" != "None"
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters 'Name=tag:Name,Values=*ModelVpc*' \
            --query 'Vpcs[0].VpcId' --output text)
          test -n "$VPC_ID" && test "$VPC_ID" != "None"
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" 'Name=group-name,Values=*ModelService*' \
            --query 'SecurityGroups[0].GroupId' --output text)
          test -n "$SG" && test "$SG" != "None"

          TASK_DEFINITION=$(aws ecs register-task-definition \
            --family fraud-detection-training \
            --requires-compatibilities FARGATE \
            --network-mode awsvpc \
            --cpu 4096 \
            --memory 8192 \
            --execution-role-arn "$ECS_EXECUTION_ROLE_ARN" \
            --task-role-arn "$ECS_TASK_ROLE_ARN" \
            --container-definitions "$(jq -cn \
              --arg name fraud-detection-training \
              --arg image "$REPO_URI:latest" \
              --arg bucket "$ARTIFACTS_BUCKET" \
              --arg region "$REGION" \
              '[{name: $name, image: $image, essential: true, environment: [
                {name: "ARTIFACTS_BUCKET", value: $bucket},
                {name: "AWS_DEFAULT_REGION", value: $region}
              ]}]')" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          test -n "$TASK_DEFINITION" && test "$TASK_DEFINITION" != "None"

          {
            echo "CLUSTER=$CLUSTER"
            echo "SUBNETS=$SUBNETS"
            echo "SG=$SG"
            echo "TASK_DEFINITION=$TASK_DEFINITION"
          } >> "$GITHUB_ENV"

      - name: Run Fargate task
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          test -n "$TASK_ARN" && test "$TASK_ARN" != "None"
          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"

      - name: Wait for completion
        run: |
          set -euo pipefail
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Exit code: $EXIT"
          test "$EXIT" = "0"

      - name: Trigger deploy
        if: success()
        run: |
          curl -L -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -d '{"event_type":"deploy"}'
