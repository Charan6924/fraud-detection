[pytest]
testpaths = tests/unit/container tests/unit/ml tests/integration/container tests/integration/api tests/contract tests/edge tests/mock
python_files = test_*.py
pythonpath = container ml
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: marks tests that require external services (docker, redis, etc.)
    slow: marks tests that take longer than 1s
    mock_dynamodb: marks tests that mock DynamoDB
    mock_redis: marks tests that mock Redis
